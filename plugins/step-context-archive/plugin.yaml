id: step-context-archive
name: Step Context Archive
description: "长会话上下文归档与召回：任务块原文落盘 + #STAMP 三点摘要索引 + 按需召回全文"
form: declarative
priority: P1
effort: S-M
status: in-progress
manifest: step.plugin.json
requires_env: []
verify:
  - "node tests/validate.mjs 通过（清单规范与资源存在性）"
  - "真实项目会话中执行 /archive 后，索引行与归档文件成对存在且路径可解析"
  - "按 stamp 召回的内容与归档原文一致，未凭记忆复述"
versions:
  - version: "1.0.0"
    type: major
    theme: 声明式上下文归档 MVP
    status: in-progress
    tasks:
      - id: SCA-100-1
        title: 编写 step.plugin.json 清单
        context: |
          字段：id=step-context-archive，version=1.0.0；commands 指向 commands/ 下两份命令文本，
          skills 指向 skills/context-archive 目录。
          遵守 AGENTS.md G2 门禁（id 安全名、version 语义化、无 entry/hooks/lspServers 字段）。
        done: true
      - id: SCA-100-2
        title: 实现 commands/archive.md（/archive 命令）
        context: |
          流程：识别可归档的已完成任务块 → 生成三点摘要（目标 / 关键决策 / 是否完成）
          → 用宿主写文件工具把块原文写入 .stepcode/context-archive/stamp-<id>.md
          → 在对话中输出 #STAMP 索引行 → 总结完毕后明确汇报任务是否完成。
          安全规则必须写入命令文本：不删除会话原始消息（只归档不销毁）、不覆盖既有归档文件、
          不写入项目外路径（除非用户指定）、写盘失败必须如实报告而不是假装成功。
        done: true
      - id: SCA-100-3
        title: 实现 commands/recall.md 与 skills/context-archive/SKILL.md
        context: |
          /recall 按 stamp 读取归档原文并基于原文回答；SKILL 说明 #STAMP 语义、三点摘要协议、
          召回纪律（何时必须召回 / 可不必召回）、适用与不适用边界。
          两份资源均为 Markdown + YAML frontmatter，与 Claude Code Agent Skills 同构。
        done: true
      - id: SCA-100-4
        title: 真实项目验证（≥2 个非玩具仓库）
        context: |
          按 AGENTS.md G1：在两个真实项目中走完「长会话 → /archive → 继续工作 → /recall 取回细节」全链路，
          记录归档文件数量、索引行与原文一致性、以及是否出现摘要与原文冲突的情况。
        done: false
      - id: SCA-100-5
        title: 补全许可引用与宿主加载状态说明（文档）
        context: |
          README 许可节补上参考实现的许可名与链接（agent-shell License v1.0，明确标注
          并非 MIT、本 PR 不含其代码），消除「采用其自身许可」这一含糊表述可能造成的
          误读；并如实标注当前宿主（Step Code v0.1.1）未接入插件命令/技能加载器的现状
          与实测证据，plugin.yaml 的 risks 首条同步该限制。
        done: true
    acceptance:
      - "索引行与归档文件成对存在，路径可解析"
      - "召回内容与归档原文一致，无凭记忆复述"
      - "除 .stepcode/context-archive/ 外不产生其他文件副作用"
    risks:
      - "宿主加载状态：截至 Step Code v0.1.1，插件安装目录未接入命令/技能加载器，本插件的 commands/skills 需宿主补齐后方才生效（已反馈上游）；MCP 型插件不受影响"
      - "声明式实现依赖模型自觉执行，缺少代码级强制（无法在压缩前自动拦截）"
      - "摘要质量随模型波动；协议已声明「摘要仅供参考、以归档原文为准」作为对冲"
      - "归档目录若被纳入版本控制，需自行加入 .gitignore 或明确提交策略"
