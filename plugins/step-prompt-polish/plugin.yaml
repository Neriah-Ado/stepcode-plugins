id: step-prompt-polish
name: Step Prompt Polish
description: "提示词润色：/polish 把草稿润色成结构化任务简报（模糊处提问澄清）、/polish-template 把常用指令提取为变量模板（移植自 dsh-prompt-polish）"
form: declarative
priority: P2
effort: S
status: done
manifest: step.plugin.json
requires_env: []
verify:
  - "润色只加约束与结构，不替用户编造需求；模糊处必须提问澄清"
versions:
  - version: "1.0.0"
    type: major
    theme: 结构化任务简报
    status: done
    notes: "移植自 dsh 生态 dsh-prompt-polish（benrong2048-boop，★11，上游核心为 MIT 的 prompt-optimizer 移植）：三模板族与迭代修订模式未逐一定制（统一为五要素结构简报），token 成本上报不移植，版本链降级为模板文件 + git 历史（声明式形态边界）"
    tasks:
      - id: PP-100-1
        title: 实现 commands/polish.md（润色为结构化简报）
        done: true
      - id: PP-100-2
        title: 实现 commands/polish-template.md（变量模板提取）
        done: true
    acceptance:
      - "润色输出保留原意，新增内容全部来自澄清问答或显式约定"
      - "模板提取后可用真实值渲染验证"
    risks:
      - "模板风格因人而异，只保证结构完整不保证文风"
  - version: "1.1.0"
    type: minor
    theme: 证据与审计
    status: done
    tasks:
      - id: PP-110-1
        title: polish 输出差异统计（新增条数/澄清条数）
        done: true
    acceptance: ["润色幅度可量化"]
    risks: []
  - version: "1.2.0"
    type: minor
    theme: 降级路径补全
    status: done
    tasks:
      - id: PP-120-1
        title: 模板文件损坏/字段缺失的修复指引
        done: true
    acceptance: ["损坏模板不阻塞 --list"]
    risks: []
  - version: "1.3.0"
    type: minor
    theme: 性能与 Token 经济
    status: done
    tasks:
      - id: PP-130-1
        title: 渲染失败快速退出，缺失变量一次给全
        done: true
    acceptance: ["失败无部分产物"]
    risks: []
  - version: "1.4.0"
    type: minor
    theme: 安全加固
    status: done
    tasks:
      - id: PP-140-1
        title: 模板 example 字段占位化（不得含真实路径/凭据）
        done: true
    acceptance: ["落盘模板零敏感信息"]
    risks: []
  - version: "1.5.0"
    type: minor
    theme: 生态联动
    status: done
    tasks:
      - id: PP-150-1
        title: 承接 step-cache-lens 稳定化建议成稿联动
        done: true
    acceptance: ["建议稿可走 /polish 成结构化简报"]
    risks: []
