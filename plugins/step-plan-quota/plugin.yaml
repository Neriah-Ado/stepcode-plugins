id: step-plan-quota
name: Step Plan Quota
description: "订阅额度与峰谷计价：/plan-quota 只读查询 Coding Plan 额度并估触顶时间、/price-peak 峰谷窗口判定与切换前提醒（移植自 dsh-cost-meter 差异化子集）"
form: declarative
priority: P2
effort: S
status: done
manifest: step.plugin.json
requires_env:
  - PLAN_QUOTA_URL
  - PLAN_QUOTA_TOKEN
verify:
  - "额度查询为用户主动发起的只读 GET，无后台轮询；凭据与原始响应零落盘"
  - "峰谷窗口表由用户本地维护，插件不内置厂商真实时段"
versions:
  - version: "1.0.0"
    type: major
    theme: 订阅额度与峰谷窗口
    status: done
    notes: "移植自 dsh 生态 dsh-cost-meter（Han-1413141）的差异化子集：订阅额度查询 + 峰谷计价提醒；用量统计已由 step-token-meter 覆盖，不重复建设；各厂商专用凭据集成不内置，以通用端点约定覆盖，自定义 Provider 余额由通用端点承接"
    tasks:
      - id: PQ-100-1
        title: 实现 commands/plan-quota.md（订阅额度只读查询）
        done: true
      - id: PQ-100-2
        title: 实现 commands/price-peak.md（峰谷窗口与提醒规则）
        done: true
    acceptance:
      - "未配置凭据时输出 export 引导而非裸报错"
      - "额度字段无法解析时摘录响应并声明，不猜"
    risks:
      - "各厂商额度响应格式差异大，模糊匹配可能覆盖不全（已按常见键匹配并诚实声明）"
  - version: "1.1.0"
    type: minor
    theme: 证据与审计
    status: done
    tasks:
      - id: PQ-110-1
        title: 输出附字段映射口径（命中键与解析依据）
        done: true
    acceptance: ["额度数字可复核到响应字段"]
    risks: []
  - version: "1.2.0"
    type: minor
    theme: 降级路径补全
    status: done
    tasks:
      - id: PQ-120-1
        title: 错误细分（超时/401/403/429）各给针对性指引
        done: true
    acceptance: ["四类错误不再笼统报失败"]
    risks: []
  - version: "1.3.0"
    type: minor
    theme: 性能与 Token 经济
    status: done
    tasks:
      - id: PQ-130-1
        title: 字段匹配 first-match-wins 即停，减少解析开销
        done: true
    acceptance: ["匹配逻辑有明确终止点"]
    risks: []
  - version: "1.4.0"
    type: minor
    theme: 安全加固
    status: done
