id: step-sec-scan
name: Step Sec Scan
description: "安全审计：/audit 依赖漏洞 + secret 泄漏扫描，结构化报告（严重度/证据/修复建议）"
form: hybrid
priority: P1
effort: M
status: not-started
manifest: step.plugin.json
requires_env: []
verify:
  - "含已知漏洞依赖与注入 secret 的样本仓库全部命中且零误报高危项"
versions:
