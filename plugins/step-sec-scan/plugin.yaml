        title: MCP server 包装扫描器
        context: "npm audit + gitleaks（staged diff 增量模式）；扫描器二进制存在性检测与安装指引（G4）。"
        done: false
      - id: SS-100-2
        title: 实现 commands/audit.md（/audit 命令）
        context: |
          输出结构化报告：严重度分级（critical/high/medium/low）+ 文件行号定位 + 修复建议。
          报告落盘 docs/security-report.md（C5），终端只给摘要。
        done: false
      - id: SS-100-3
        title: 误报降噪规则
        context: "测试文件/示例目录中的 secret 样式串、已知 dev 依赖低危项等降噪规则写入 skill。"
        done: false
    acceptance:
