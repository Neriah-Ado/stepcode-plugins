id: step-token-meter
name: Step Token Meter
description: "本地会话/Token 消耗统计：/usage 聚合、成本估算、HTML 报告，纯本地零上传"
form: mcp
priority: P0
effort: M
status: not-started
manifest: step.plugin.json
requires_env: []
verify:
  - "统计口径与实际账单偏差可解释"
  - "会话存储字段变动时容错解析不崩溃"
versions:
  - version: "1.0.0"
    type: major
    theme: 本地统计 MVP
    status: not-started
    tasks:
      - id: TM-100-1
        title: 逆向 ~/.stepcode 会话存储格式
        context: |
          只读分析本地目录结构与字段语义，写成 docs/storage-format.md（含字段名、示例、解析容错策略）。
          严禁修改或删除任何 ~/.stepcode 下文件。
        done: false
      - id: TM-100-2
        title: 实现 commands/usage.md（/usage 命令）
        context: "按日/按项目聚合 token 消耗 + 内置默认单价表成本估算，终端表格输出。"
        done: false
      - id: TM-100-3
        title: CSV 导出
        context: "导出到项目 .stepcode/usage-export.csv 或用户指定路径。"
        done: false
      - id: TM-100-4
        title: 容错解析层
        context: "未知字段忽略、缺失字段默认值、格式不匹配跳过该条记录并计数警告，绝不中断。"
        done: false
    acceptance:
      - "统计结果与手动抽查一致"
      - "对格式变动样本容错"
      - "全程零网络请求（隐私卖点）"
    risks:
      - "存储格式未文档化，可能随版本变动（已建容错层对冲）"
  - version: "1.1.0"
    type: minor
    theme: MCP 化与精度
    status: not-started
    tasks:
      - id: TM-110-1
        title: MCP server 化（TypeScript + @modelcontextprotocol/sdk）
        context: "工具：get_usage(range)、get_usage_by_model(range)；npx 可运行（C1/C6）。"
        done: false
      - id: TM-110-2
        title: 可配置单价表
        context: "JSON 覆盖内置默认，支持热加载；路径走环境变量或配置约定。"
        done: false
      - id: TM-110-3
        title: 更新 step.plugin.json 注册 mcpServers
        done: false
    acceptance:
      - "MCP 工具在交互中被模型正确调用"
      - "单价表热加载生效"
    risks: []
  - version: "1.2.0"
    type: minor
    theme: 可视化
    status: not-started
    tasks:
      - id: TM-120-1
        title: HTML 本地报告（内联图表，无外部 CDN）
        context: "日/项目/模型三维度图表；暗色主题可读。"
        done: false
      - id: TM-120-2
        title: "/cron 周报自动生成落盘"
        done: false
    acceptance:
      - "报告在 4K/暗色环境可读"
    risks: []
  - version: "1.3.0"
    type: minor
    theme: 预算与扩展
    status: not-started
    tasks:
      - id: TM-130-1
        title: 预算阈值告警（会话内提示）
        done: false
      - id: TM-130-2
        title: 多机数据合并
        context: "各机导出标准格式后聚合，不做网络同步。"
        done: false
      - id: TM-130-3
        title: 存储格式 schema migration 适配层
        context: "格式版本号 → 解析器映射，新版本格式只需加映射。"
        done: false
    acceptance:
      - "Step Code 升级一个 minor 后统计仍正常"
    risks: []
