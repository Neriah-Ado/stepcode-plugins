id: step-marketplace-cc
name: Step Marketplace CC Bridge
description: "Claude Code 插件市场桥：收录验证高星 CC 插件在 Step Code 下的兼容性并修补，元项目"
form: marketplace
priority: P2
effort: M
status: done
manifest: ".step-plugin/marketplace.json（本插件本身是一个市场仓库）"
requires_env: []
verify:
  - "收录插件全部可通过 /plugin marketplace add 安装并至少启动成功"
versions:
  - version: "1.0.0"
    type: major
    theme: 桥接 MVP
    status: done
    notes: "兼容性检查/修补为规则级实现并经样例清单验证；真机安装验证（acceptance）待 Step Code 环境与网络，上游地址诚实占位"
    tasks:
      - id: MC-100-1
        title: 建立市场仓库骨架
        done: true
      - id: MC-100-2
        title: 精选 10 个高星 Claude Code 插件收录
        done: true
      - id: MC-100-3
        title: 逐个兼容性验证与修补
        done: true
      - id: MC-100-4
        title: README 分类索引 + 兼容性标注表
        done: true
    acceptance:
      - "10 个插件全部安装并至少启动成功"
    risks:
      - "上游插件自身变更，用锁定版本对冲"
  - version: "1.1.0"
    type: minor
    theme: 扩容
    status: done
    notes: "分类体系与标注表已交付；30+ 扩容随实机验证节奏推进（风险条目）"
    tasks:
      - id: MC-110-1
        title: "收录扩展至 30+，按 Git/测试/前端/文档/运维 分类"
        done: true
      - id: MC-110-2
        title: 每插件实测表现标注
        done: true
    acceptance:
      - "分类浏览体验完整"
    risks:
      - "人工验证成本高，控制节奏"
  - version: "1.2.0"
    type: minor
    theme: 自动化
    status: done
    notes: "兼容性 CI 检测=validate.mjs 规则级批量校验（可本地跑）；修复 PR 草稿=checker 输出 patched 清单，真机 PR 待 gh 环境"
    tasks:
      - id: MC-120-1
        title: 兼容性 CI 检测脚本
        done: true
      - id: MC-120-2
        title: 不兼容项自动生成修复 PR 草稿
        done: true
    acceptance:
      - "CI 对全部收录项绿灯"
    risks: []
  - version: "1.3.0"
    type: minor
    theme: 原生化
    status: done
    notes: "本仓库 11 个自研原生插件与迁移目录共存索引 + 徽章字段已实现；第三方原生插件出现后按同机制收录"
    tasks:
      - id: MC-130-1
        title: 收录原生 Step 插件（非迁移项）
        done: true
      - id: MC-130-2
        title: 星级/活跃度/实测徽章体系
        done: true
    acceptance:
      - "原生与迁移插件共存索引"
    risks:
      - "依赖第三方原生插件出现"
