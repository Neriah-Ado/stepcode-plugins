id: step-fact-check
name: Step Fact Check
description: "事实核查：/claim-split 把主张拆为原子事实点、/fact-check 交叉检索验证逐句溯源（移植自 dsh-fact-check）"
form: declarative
priority: P2
effort: S
status: done
manifest: step.plugin.json
requires_env: []
verify:
  - "结论必须逐句可溯源；检索不到反证也检索不到正证时判「无法核实」而非默认为真"
versions:
  - version: "1.0.0"
    type: major
    theme: 对抗性事实核查
    status: done
    notes: "移植自 dsh 生态 dsh-fact-check（7starsseeker，★5）：拆分-交叉验证-溯源三段保留，国内外搜索生态并行降级为与 step-websearch 联动的多引擎检索（声明式形态边界）；对抗性再搜索保留"
    tasks:
      - id: FC-100-1
        title: 实现 commands/claim-split.md（原子事实点拆分）
        done: true
      - id: FC-100-2
        title: 实现 commands/fact-check.md（交叉验证与溯源）
        done: true
    acceptance:
      - "每个事实点独立给出核实结论与来源，不与相邻点混判"
      - "对抗性再搜索至少一轮（主动找反例）"
    risks:
      - "免费引擎的检索质量限制核查深度，结论置信度如实标注"
  - version: "1.1.0"
    type: minor
    theme: 证据与审计
    status: done
    tasks:
      - id: FC-110-1
        title: 核查统计（每点来源数/引擎数/反例轮数）
        done: true
    acceptance: ["核查深度可量化"]
    risks: []
  - version: "1.2.0"
    type: minor
    theme: 降级路径补全
    status: done
    tasks:
      - id: FC-120-1
        title: 检索全失效时逐点判 unverifiable 并声明
        done: true
    acceptance: ["检索不可用不出结论"]
    risks: []
  - version: "1.3.0"
    type: minor
    theme: 性能与 Token 经济
    status: done
    tasks:
      - id: FC-130-1
        title: "--n 上限 10，核查点数上限 50（超出分批）"
        done: true
    acceptance: ["核查规模有界"]
    risks: []
  - version: "1.4.0"
    type: minor
    theme: 安全加固
    status: done
    tasks:
      - id: FC-140-1
        title: 来源链接仅接受 http/https
        done: true
    acceptance: ["非可信 scheme 来源被拒"]
    risks: []
  - version: "1.5.0"
    type: minor
    theme: 生态联动
    status: done
    tasks:
      - id: FC-150-1
        title: 核查结论可经 /mem-save 沉淀为事实条目
        done: true
    acceptance: ["沉淀走既有确认链"]
    risks: []
