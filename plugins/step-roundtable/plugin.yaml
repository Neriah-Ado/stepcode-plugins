id: step-roundtable
name: Step Roundtable
description: "多专家圆桌评审：/roundtable 组建专家团独立评审议题、汇聚分歧交用户拍板、/rt-roles 维护角色模板（移植自 dsh-plugin-roundtable）"
form: declarative
priority: P1
effort: S
status: done
manifest: step.plugin.json
requires_env: []
verify:
  - "专家首轮意见互不可见，防止锚定；分歧必须交用户拍板，不得自动合并"
