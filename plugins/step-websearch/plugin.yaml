id: step-websearch
name: Step Web Search
description: "多引擎聚合搜索：/websearch 零 key 引擎开箱即用、key 后端环境变量激活、并发 fan-out 去重；/search-brief 归纳带来源简报（移植自 dsh-websearch）"
form: declarative
priority: P2
effort: S
status: done
manifest: step.plugin.json
requires_env: []
verify:
  - "全部凭据走环境变量，代码与输出零硬编码；DuckDuckGo 为唯一零配置引擎，预期开箱即用（引擎反爬策略变化时显式标注失效并降级）"
  - "部分引擎失败不阻塞整体；结果截断防上下文膨胀（C5）"
versions:
  - version: "1.0.0"
    type: major
    theme: 多引擎聚合
    status: done
    notes: "移植自 dsh 生态 dsh-websearch（240xu，★9）：11 引擎矩阵保留常用子集（零 key 兜底 + key 后端），MCP 进程形态降级为命令内 curl/fetch 指引（声明式形态边界）；并发 fan-out 与 URL 去重语义保留"
    tasks:
      - id: WB-100-1
        title: 实现 commands/websearch.md（多引擎聚合）
        done: true
      - id: WB-100-2
        title: 实现 commands/search-brief.md（来源简报）
        done: true
    acceptance:
      - "零配置即可用（DuckDuckGo）；配置 SEARXNG_BASE_URL 或 key 环境变量后自动激活对应后端"
      - "结果逐条带来源链接，引擎失败显式标注不静默"
    risks:
      - "搜索引擎反爬策略变化可能导致零 key 引擎失效（降级链路已声明）"
  - version: "1.1.0"
    type: minor
    theme: 证据与审计
    status: done
    tasks:
      - id: WB-110-1
        title: 引擎健康遥测行（每引擎成功/失败/条数）
        done: true
    acceptance: ["引擎可用性可观测"]
    risks: []
  - version: "1.2.0"
    type: minor
    theme: 降级路径补全
    status: done
    tasks:
      - id: WB-120-1
        title: 全部引擎失效时判「检索不可用」并声明，不静默出空结果
        done: true
    acceptance: ["零结果有归因"]
    risks: []
  - version: "1.3.0"
    type: minor
    theme: 性能与 Token 经济
    status: done
    tasks:
      - id: WB-130-1
        title: "单引擎条数上限 10、超时预算总上限 30s"
        done: true
    acceptance: ["整体耗时与输出有界"]
    risks: []
  - version: "1.4.0"
    type: minor
    theme: 安全加固
    status: done
    tasks:
      - id: WB-140-1
        title: "SEARXNG_BASE_URL scheme 校验；query 长度上限 500 字符"
        done: true
    acceptance: ["非法 scheme/超长 query 被拒"]
    risks: []
  - version: "1.5.0"
    type: minor
