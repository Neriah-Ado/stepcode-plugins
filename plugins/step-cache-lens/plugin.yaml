id: step-cache-lens
name: Step Cache Lens
description: "提示词缓存体检：/cache-audit 定位每轮首个请求的缓存重建（cache miss）、/cache-stabilize 前缀稳定化审计与改造草稿（移植自 dsh-cache-miss / dsh-cache-stabilizer）"
form: declarative
priority: P1
effort: S-M
status: done
manifest: step.plugin.json
requires_env: []
verify:
  - "缓存重建判定只基于本地会话记录的 cache_read/cache_write 字段，零网络"
  - "稳定化只输出 diff 草稿，绝不直接改写用户配置"
versions:
  - version: "1.0.0"
    type: major
    theme: 缓存可观测与稳定化
    status: done
    notes: "移植自 dsh 生态 dsh-cache-miss（wefio）与 dsh-cache-stabilizer（dongsheng123132）：宿主内联告警改为命令报告；会话记录沿用 ~/.stepcode/projects 容错解析口径"
    tasks:
      - id: CL-100-1
        title: 实现 commands/cache-audit.md（缓存重建检测）
        done: true
      - id: CL-100-2
        title: 实现 commands/cache-stabilize.md（前缀稳定化审计）
        done: true
    acceptance:
      - "对含 cache_write 陡增的会话样本能逐轮定位重建点并给出嫌疑前缀变更"
      - "无会话记录时输出采集指引而非报错"
    risks:
      - "Step Code 会话记录若未导出 cache 字段，降级为手工标记法并列明局限"
  - version: "1.1.0"
    type: minor
    theme: 证据与审计
    status: done
    tasks:
      - id: CL-110-1
        title: cache-audit 报告落盘带统计摘要与内容校验和
        done: true
      - id: CL-110-2
        title: cache-stabilize 指标快照落盘
        done: true
    acceptance: ["落盘报告可独立复核（含统计与校验和）"]
    risks: []
  - version: "1.2.0"
    type: minor
    theme: 降级路径补全
    status: done
    tasks:
      - id: CL-120-1
        title: 会话字段缺失区分「未导出/已迁移」两态并分别给指引
        done: true
    acceptance: ["两种降级态都有明确采集或迁移指引"]
    risks: []
  - version: "1.3.0"
    type: minor
    theme: 性能与 Token 经济
    status: done
    tasks:
      - id: CL-130-1
        title: "cache-audit 默认只扫最近 50 轮，防全量扫描"
        done: true
    acceptance: ["默认扫描量有界，全量需显式 --all"]
    risks: []
  - version: "1.4.0"
    type: minor
    theme: 安全加固
    status: done
    tasks:
      - id: CL-140-1
        title: 输出中用户目录路径脱敏
        done: true
    acceptance: ["输出不含本机用户名等可识别路径"]
    risks: []
  - version: "1.5.0"
    type: minor
    theme: 生态联动
    status: done
    tasks:
      - id: CL-150-1
        title: "/cron 接入与退出码约定（0 正常/1 发现重建/2 依赖缺失）"
        done: true
    acceptance: ["无头模式可跑且退出码语义明确"]
    risks: []
