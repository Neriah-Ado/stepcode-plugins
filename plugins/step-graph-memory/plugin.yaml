id: step-graph-memory
name: Step Graph Memory
description: "跨会话图谱记忆：/mem-graph 把任务与决策沉淀为实体-关系图谱（JSON 存储，写盘先 diff）、/mem-recall 按主题带证据召回（移植自 graph-memory）"
form: declarative
priority: P1
effort: S-M
status: done
manifest: step.plugin.json
requires_env: []
verify:
  - "图谱写入先 diff 后确认，绝不覆盖既有边，只做合并"
  - "召回只读，答案基于 evidence 原文，检索不到禁止编造"
versions:
  - version: "1.0.0"
    type: major
    theme: 跨会话记忆图谱
    status: done
    notes: "移植自 dsh 生态 graph-memory（adoresever/graph-memory v1.6.0-beta.16）：sqlite/向量检索/社区发现降级为纯 JSON 存储 + 度中心性（声明式形态边界，诚实标注）；上下文接管/历史裁剪不覆盖；evidence 为指针不存原文"
    tasks:
      - id: GM-100-1
        title: 实现 commands/mem-graph.md（图谱构建与合并）
        done: true
      - id: GM-100-2
        title: 实现 commands/mem-recall.md（图谱召回）
        done: true
    acceptance:
      - "每条边都带 evidence 来源；重复构建幂等合并"
      - "召回排序稳定且给出证据摘引"
    risks:
      - "大图谱（>2000 节点）全量读入成本高，超限时建议分域建图"
  - version: "1.1.0"
    type: minor
    theme: 证据与审计
    status: done
    tasks:
      - id: GM-110-1
        title: 写盘后输出审计行（节点/边/冲突计数 + diff 摘要）
        done: true
    acceptance: ["每次落盘后可复核增量账目"]
    risks: []
  - version: "1.2.0"
    type: minor
    theme: 降级路径补全
    status: done
    tasks:
      - id: GM-120-1
        title: 图谱缺失/损坏时给重建与 step-engram 互备指引
        done: true
    acceptance: ["损坏态不裸报错"]
    risks: []
  - version: "1.3.0"
    type: minor
    theme: 性能与 Token 经济
    status: done
    tasks:
      - id: GM-130-1
        title: "--prune 裁剪孤立节点（先报告清单后确认）"
        done: true
    acceptance: ["裁剪不静默"]
    risks: []
  - version: "1.4.0"
    type: minor
    theme: 安全加固
    status: done
    tasks:
      - id: GM-140-1
        title: evidence 指针路径越界检查（仅项目相对路径，拒绝 .. 与绝对路径）
        done: true
    acceptance: ["越界指针被拒并提示修正"]
    risks: []
  - version: "1.5.0"
    type: minor
    theme: 生态联动
    status: done
    tasks:
      - id: GM-150-1
        title: 边可引用 step-engram 条目 id 作为 evidence 类型（跨库互链）
        done: true
    acceptance: ["互链 id 可在对方库中取回"]
    risks: []
